name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        # v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26.12.1
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Check generated tool documentation
        run: npm run docs:tools:check

      - name: Run lint
        run: npm run lint

      - name: Type-check production sources
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check diff whitespace
        run: git diff --check

  check:
    name: check
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success

  compatibility:
    name: >-
      ${{ (startsWith(github.head_ref, 'factory/pr/') ||
      startsWith(github.head_ref, 'factory/run/') ||
      github.event.pull_request.user.login == 'exe-dev-github-integration[bot]') &&
      'factory-compatibility' || 'factory-gates' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: printf '%s\n' 'Ordinary PR compatibility; not factory certification.'

  windows-unit:
    name: Unit tests (Windows, non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        # v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26.12.1
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test
